<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task_04</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <main class="bg-conic-180 from-indigo-600 via-indigo-200 to-indigo-600">
      <!-- Image Section-->
      <div class="mx-[450px] pt-[130px] mb-16">
        <img
          id="img"
          class="rounded-2xl"
          width="1000px"
          height="1000px"
          src="./assets/light_off.jpeg"
          alt=""
        />
      </div>
      
      <div class="flex items-center justify-center pb-20">
        <div class="flex flex-col items-center">
          <div
            class="bg-gradient-to-br from-pink-500 via-fuchsia-500 to-purple-600 rounded-3xl shadow-2xl shadow-gray-800 p-20 w-[600px]"
          >
            <div class="flex justify-center">
              <div
                class="w-20 h-20 bg-indigo-100 rounded-full text-4xl flex justify-center items-center"
              >
                💍
              </div>
            </div>

            <h1
              class="text-[40px] font-extrabold text-gray-900 text-center mt-4"
            >
              🔍 Where Is My Wife?
            </h1>
            <p class="text-gray-600 text-xl text-center mb-6">
              Enter your Age to Find Your Future Wife!
            </p>
            <div class="bg-gray-100 rounded-xl py-3 px-4 text-center mb-12">
              <span id="door" class="text-gray-800 font-medium text-xl"
                >🔮 Ready to Find Her?</span
              >
            </div>
            <label class="block text-gray-900 text-xl font-semibold mb-2"
              >Enter Your Age</label
            >
            <input
              id="password"
              type="number"
              maxlength="4"
              placeholder="Please Enter Your Age"
              class="w-full border border-gray-300 rounded-xl py-4 text-center text-xl mb-6"
            />

            <!-- Unlock Button -->
            <button
              id="btn"
              class="w-full bg-indigo-600 hover:bg-indigo-700 text-xl text-white font-semibold py-4 rounded-xl mb-4"
            >
              🔍 Where Is She?
            </button>
            <p id="message" class="text-center text-gray-800"></p>
          </div>
        </div>
      </div>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
