<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task_04</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <main class="bg-conic-180 from-indigo-600 via-indigo-200 to-indigo-600">
      <!-- Image Section-->
      <div  class="mx-[450px] pt-[130px] rounded-2xl mb-16">
        <img
          id="img"
         
          width="1000px"
          height="1000px"
          src="./assets/light_off.jpeg"
          alt=""
        />
      </div>
      <div class="  flex mx-auto items-center justify-center pb-20" >
        <div class="flex flex-col items-center shadow-2xl shadow-gray-800">
          <div class="bg-white rounded-3xl shadow-2xl p-10 w-[520px]">
            <div class="flex justify-center mb-6">
              <div class="w-24 h-24 bg-indigo-100 rounded-full flex items-center justify-center text-5xl" >
                🔒
              </div>
            </div>

            <h1 class="text-3xl font-extrabold text-gray-900 text-center mb-2">
              Smart Door Lock
            </h1>
            <p class="text-gray-500 text-center mb-6">
              Enter your PIN to unlock the door
            </p>
            <div class="bg-gray-100 rounded-xl py-3 px-4 text-center mb-6">
              <span id="door" class="text-gray-800 font-medium"
                >🔒 Door is Locked</span
              >
            </div>
            <label class="block text-gray-900 font-semibold mb-2"
              >Enter PIN</label
            >
            <input
              id="password"
              type="password"
              maxlength="4"
              placeholder="****"
              class="w-full border border-gray-300 rounded-xl py-4 text-center text-2xl tracking-[10px] mb-6 focus:outline-none focus:ring-2 focus:ring-indigo-500"
            />

            <!-- Unlock Button -->
            <button
              id="btn"
              class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-4 rounded-xl mb-4 transition-colors"
            >
              🔓 Unlock Door
            </button>
            <p id="message" class="text-center text-gray-800"></p>
          </div>
            <!-- <p class="text-gray-400 mt-6">🔒 Secure Access System</p> -->
        </div>
       
      </div>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
